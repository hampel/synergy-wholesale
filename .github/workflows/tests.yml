name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the "php" constraint in composer.json claims. Keep the
        # two in step: an untested version here is an unbacked promise there.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap, dom, json
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest

    # Every other job installs the newest of everything, so a dev-tool
    # constraint that claims more than it can deliver never gets tested. This
    # one resolves the floor and runs against it.
    #
    # Pint is deliberately not run here. It is a formatter whose rule set moves
    # between patches, so the oldest Pint could reject code the newest accepts,
    # which is churn rather than a defect.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: soap, dom, json
          coverage: none

      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - run: vendor/bin/phpunit

      - run: vendor/bin/phpstan analyse --no-progress

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: soap, dom, json
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/pint --test

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: soap, dom, json
          coverage: none
          # Both are dev dependencies the install below deletes, so both have to come
          # from outside the package. setup-php installs them outside every vendor
          # tree, which for PHPStan is load-bearing: a PHPStan run from beside another
          # vendor directory resolves that directory's classes too, and passes on
          # exactly the undeclared dependency this job exists to catch.
          tools: phpstan, composer-require-checker

      # Analyse src/ with the dev dependencies gone, so anything it calls that is
      # not in "require" comes back as not-found. Nothing else catches this: the
      # "analyse" job has phpunit, pint and rig installed and sees nothing wrong,
      # and the package would fatal for the consumer instead. The surface is small
      # enough to be worth holding exactly - php, ext-json, ext-soap and psr/log,
      # nothing more.
      - run: composer install --no-dev --prefer-dist --no-progress

      # -c is not optional. Without it PHPStan discovers the package's own
      # phpstan.neon, which analyses tests/ and tools/ and can no longer resolve
      # PHPUnit - turning the run into a configuration error while you are trying
      # to read it as a dependency result.
      - run: >
          phpstan analyse
          -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

      # PHPStan holds the package half of "require" and cannot hold the rest. An
      # undeclared ext-* is invisible to it - it knows ctype_alpha() and mb_strlen()
      # from its own stubs, and the runner has whatever setup-php installed. And
      # --no-dev removes require-dev and nothing else, so every transitive package is
      # still there and every symbol still resolves. composer-require-checker maps
      # each symbol back to the package that supplies it, fails on anything outside
      # "require", and names the extension where it can guess one.
      #
      # src/Generated is autoloaded and so is scanned like the rest of src - if the
      # generator ever emits a symbol from outside "require", this is the job that
      # says so, on a file nobody wrote by hand.
      - run: composer-require-checker check composer.json

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest

    # src/Generated is committed, which is what lets consumers install without
    # the generator and lets a diff show what changed when Synergy Wholesale
    # publishes a new WSDL. That only holds while the committed output actually
    # matches the generator, so regenerate and fail on any difference.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: soap, dom, json
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: composer generate

      - name: src/Generated matches the pinned WSDL
        run: |
          if ! git diff --quiet -- src/Generated; then
            echo 'Generated code is stale. Run `composer generate` and commit the result.'
            git diff --stat -- src/Generated
            exit 1
          fi

  wsdl:
    name: Upstream WSDL unchanged
    runs-on: ubuntu-latest
    continue-on-error: true

    # Informational only. The pinned WSDL in resources/ is the contract this
    # package was built against; this job says when upstream has moved on, so
    # regenerating is a deliberate act rather than a surprise.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with the published WSDL
        run: |
          curl -fsS --max-time 60 'https://api.synergywholesale.com/?wsdl' -o /tmp/upstream.xml
          if ! diff -q resources/wsdl.xml /tmp/upstream.xml >/dev/null; then
            echo '::warning::The published WSDL differs from resources/wsdl.xml.'
            diff <(grep -o 'operation name="[^"]*"' resources/wsdl.xml | sort -u) \
                 <(grep -o 'operation name="[^"]*"' /tmp/upstream.xml | sort -u) || true
          else
            echo 'Pinned WSDL matches upstream.'
          fi
